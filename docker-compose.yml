services:
  backend:
    build:
      context: ./backend/cv
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DJANGO_KEY=${DJANGO_KEY:-django-insecure-change-me-in-dev}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
    volumes:
      - ./backend/cv:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./app:/app
      - /app/node_modules
    restart: unless-stopped
